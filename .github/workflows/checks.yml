name: checks

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # 08:00 IST: daily health check of the live sources

jobs:
  code:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  live-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Real search engines, career sites, job boards and DNS
        run: npm run test:live

